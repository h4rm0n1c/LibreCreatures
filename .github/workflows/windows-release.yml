name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCreatures-windows-x86
          path: dist/LibreCreatures-windows-x86.zip
          if-no-files-found: error

  # The neorender build (SDL3 drawing, zoom, S32 art) ships on the same
  # release page.  It is built from the neorender branch for a release tag,
  # and on a manual run to check that it builds and packages.
  build-neorender:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Check out the neorender branch
        uses: actions/checkout@v4
        with:
          ref: neorender

      - name: Configure MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and package
        shell: pwsh
        run: .\scripts\build-release.ps1 -ArchivePath dist/LibreCreatures-neorender-windows-x86.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCreatures-neorender-windows-x86
          path: dist/LibreCreatures-neorender-windows-x86.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-neorender]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Two builds of the same game. Choose one:

          - **LibreCreatures-windows-x86.zip** is the regular build. It draws the world as the original does.
          - **LibreCreatures-neorender-windows-x86.zip** is the neorender build. It adds SDL3 drawing, zoom, S32 and double-resolution (`@2x.s32`) art, smooth motion and world speed. `SDL3.dll` must stay beside `Creatures.exe`.

          Each zip has `Creatures.exe`, the kits and `c1kitlib.dll`. Copy them into a Creatures 1 install (keep copies of the files you replace), then run each kit once on its own so that it registers. Both builds need the x86 Visual C++ 2015-2022 runtime with MFC. The original game's data is not included.

          What LibreCreatures changes from Creatures 1 CE and the 1996 kits (fixes, new features and deliberate changes) is listed in [Changes from Creatures 1 Community Edition](https://github.com/h4rm0n1c/LibreCreatures/blob/main/docs/changes-from-ce.md).

          `SOURCE-CODE.txt` in each zip names the commit it was built from.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            release/LibreCreatures-windows-x86.zip \
            release/LibreCreatures-neorender-windows-x86.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LibreCreatures $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --latest
