name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCreatures-windows-x86
          path: dist/LibreCreatures-windows-x86.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LibreCreatures-windows-x86
          path: release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/LibreCreatures-windows-x86.zip --repo "$GITHUB_REPOSITORY" --generate-notes --title "LibreCreatures $GITHUB_REF_NAME"
