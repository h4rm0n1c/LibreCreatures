name: Windows build and release

# Ordinary pushes and PRs only get a fast single-variant compile check
# (LibreCreatures ships four variants -- 32/64-bit x classic/neorender
# rendering -- and building all four on every push is wasteful). The full
# matrix, packaged and released, only runs for a version tag or a manual
# dispatch.

on:
  pull_request:
  push:
    branches: [main, neorender]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure and build (no packaging)
        shell: pwsh
        run: |
          cmake -S . -B build/smoke -G "Visual Studio 17 2022" -A Win32
          cmake --build build/smoke --config Release --parallel

  # The full four-way matrix: each of {main, neorender} x {x86, x64},
  # packaged and uploaded. Only for a release tag or a manual run.
  build-matrix:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        branch: [main, neorender]
        arch: [x86, x64]
    runs-on: windows-2022
    steps:
      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch == 'main' && startsWith(github.ref, 'refs/tags/v') && github.sha || matrix.branch }}

      - name: Build and package
        shell: pwsh
        run: |
          $suffix = if ("${{ matrix.branch }}" -eq "neorender") { "-neorender" } else { "" }
          .\scripts\build-release.ps1 -Arch ${{ matrix.arch }} `
            -ArchivePath "dist/LibreCreatures$suffix-windows-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: LibreCreatures-${{ matrix.branch }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # Exercise artifact download and verify package names without publishing.
  check-packages:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Check release packages
        shell: bash
        run: |
          for variant in "" "-neorender"; do
            for arch in x86 x64; do
              test -f "release/LibreCreatures${variant}-windows-${arch}.zip"
            done
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LibreCreatures $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --generate-notes \
            --latest
