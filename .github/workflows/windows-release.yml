name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCreatures-windows-x86
          path: dist/LibreCreatures-windows-x86.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/LibreCreatures-windows-x86.zip --generate-notes --title "LibreCreatures $env:GITHUB_REF_NAME"
